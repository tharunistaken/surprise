<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anjali ❤️</title>

<style>
body{margin:0;font-family:Arial;background:#111;color:white;text-align:center;overflow:hidden}
.hero{padding-top:120px}
button{padding:15px 30px;font-size:20px;border:none;border-radius:12px;background:#ff4d6d;color:white;cursor:pointer}
.main{display:none;padding-top:60px}
img{width:260px;border-radius:20px;margin:10px}
.heart{position:fixed;color:#ff4d6d;animation:float 5s linear infinite}
@keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-100vh)}}
#final{display:none;position:fixed;inset:0;background:black;align-items:center;justify-content:center;flex-direction:column}
#final img{max-width:70%;border-radius:20px}
</style>
</head>

<body>

<div class="hero">
<h1>Tap to open your gift 🎁</h1>
<button onclick="openSite()">Open</button>
</div>

<div class="main" id="main">
<h1>Happy Birthday Anjali 🎂</h1>
<p>This song is only for you.</p>

<img src="img1.jpg">
<img src="img2.jpg">

<br><br>
<button onclick="showEnd()">Final Surprise</button>
</div>

<div id="final">
<img src="her.jpg">
<h1>I love you ❤️</h1>
</div>

<audio id="song">
<source src="song.mp3">
</audio>

<script>
function openSite(){
document.querySelector('.hero').style.display="none";
document.getElementById("main").style.display="block";
document.getElementById("song").play();
setInterval(heart,300);
}

function heart(){
let e=document.createElement("div");
e.className="heart";
e.innerHTML="❤️";
e.style.left=Math.random()*100+"vw";
e.style.top="100vh";
e.style.fontSize=Math.random()*30+20+"px";
document.body.appendChild(e);
setTimeout(()=>e.remove(),5000);
}

function showEnd(){
document.getElementById("final").style.display="flex";
}
</script>

</body>
</html>
