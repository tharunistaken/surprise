<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>For Anjali ❤️</title> <style> body{ margin:0; font-family:Arial; background:#0b0b0b; color:white; text-align:center; overflow:hidden } .hero{ height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center } button{ padding:16px 32px; font-size:20px; border:none; border-radius:14px; background:#ff4d6d; color:white; cursor:pointer; box-shadow:0 0 20px #ff4d6d66 } #main{ display:none; padding-top:60px } #poem{ max-width:700px; margin:40px auto; font-size:20px; line-height:1.7; white-space:pre-line; opacity:0; transition:1s } .heart{ position:fixed; color:#ff4d6d; animation:float 6s linear infinite } @keyframes float{ 0%{transform:translateY(0)} 100%{transform:translateY(-110vh)} } #final{ display:none; position:fixed; inset:0; background:black; align-items:center; justify-content:center; flex-direction:column } #final img{ max-width:80%; border-radius:20px; box-shadow:0 0 40px pink } </style> </head> <body> <div class="hero" id="hero"> <h1>Tap to open your gift 🎁</h1> <br> <button onclick="start()">Open</button> </div> <div id="main"> <h1>Happy Birthday Anjali ❤️</h1> <div id="poem"></div> <br> <button onclick="showEnd()">Final Surprise</button> </div> <div id="final"> <img src="her.jpg"> <h1>I love you ❤️</h1> </div> <audio id="song" autoplay loop> <source src="song.mp3"> </audio> <script> let text = `Happy Birthday Anjali ❤️ From the moment you came into my life, everything felt different. You are not just a person, you are the calm in my chaos, the smile in my worst days, the reason I check my phone for no reason. If beauty had a face, it would still be jealous of you. If love had a name, it would probably be yours. I don’t know what the future holds, but I know one thing — I want you in it. You are my favorite notification, my favorite thought, my favorite person. I hope today makes you smile as much as you make me smile every day. Happy Birthday, my girl. ❤️`; function start(){ document.getElementById("hero").style.display="none"; document.getElementById("main").style.display="block"; document.getElementById("song").play(); typeText(); setInterval(createHeart,250); } function typeText(){ let i=0; let speed=35; let box=document.getElementById("poem"); box.style.opacity=1; function typing(){ if(i<text.length){ box.innerHTML+=text.charAt(i); i++; setTimeout(typing,speed); } } typing(); } function createHeart(){ let e=document.createElement("div"); e.className="heart"; e.innerHTML="❤️"; e.style.left=Math.random()*100+"vw"; e.style.top="100vh"; e.style.fontSize=Math.random()*30+20+"px"; document.body.appendChild(e); setTimeout(()=>e.remove(),6000); } function showEnd(){ document.getElementById("final").style.display="flex"; } </script> </body> </html>
