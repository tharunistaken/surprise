<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anjali</title>

<style>
body{margin:0;background:#fbd6dc;font-family:sans-serif;text-align:center;overflow:hidden}

#envelope{margin-top:120px;cursor:pointer}
#letter{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center}
#card{background:white;padding:30px;border-radius:20px;width:340px}

#photoPage{
display:none;
position:fixed;
inset:0;
background:#000;
align-items:center;
justify-content:center;
flex-direction:column;
}

#photoPage img{
max-width:70%;
border-radius:20px;
box-shadow:0 0 40px pink;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
margin-top:20px;
}
</style>
</head>

<body>

<h1>My Girl ❤️ Happy Birthday</h1>

<img id="envelope" src="https://i.imgur.com/6RLc3qE.png" width="220" onclick="openLetter()">

<div id="letter">
<div id="card">
<h2>Happy Birthday</h2>
<p>You are the best thing in my life.</p>
<button onclick="showPhoto()">Open Final</button>
</div>
</div>

<div id="photoPage">
<img src="her.jpg">
<h2 style="color:white">I love you forever ❤️</h2>
</div>

<audio id="song">
<source src="song.mp3">
</audio>

<script>
function openLetter(){
document.getElementById("letter").style.display="flex";
document.getElementById("song").play();
}

function showPhoto(){
document.getElementById("letter").style.display="none";
document.getElementById("photoPage").style.display="flex";
}
</script>

</body>
</html>
