<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body{
  margin:0;
  background:#f7cdd3;
  font-family:Arial;
  text-align:center;
}

/* heading */
h1{
  padding-top:40px;
}

/* popup */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,0.3);
}

button{
  padding:12px 25px;
  border:none;
  background:#ff4d6d;
  color:white;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

/* final photo */
.final{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  justify-content:center;
  align-items:center;
}

.final img{
  max-width:70%;
  max-height:85%;
  border-radius:20px;
}
</style>
</head>

<body>

<h1>My Girl ❤️ Happy Birthday</h1>

<div class="popup" id="popup">
  <h2>Happy Birthday</h2>
  <p>You are the best thing in my life.</p>
  <button onclick="openFinal()">Open Final</button>
</div>

<div class="final" id="final">
  <img src="her.jpg">
</div>

<audio id="song" src="song.mp3"></audio>

<script>
function openFinal(){
  document.getElementById("popup").style.display="none";
  document.getElementById("final").style.display="flex";
  document.getElementById("song").play();
}
</script>

</body>
</html>
