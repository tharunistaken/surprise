<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anjali ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
text-align:center;
overflow:hidden;
}

header{
padding:20px;
font-size:26px;
}

.hero{
padding-top:140px;
}

button{
padding:18px 40px;
font-size:20px;
border:none;
border-radius:14px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

#final{
display:none;
position:fixed;
inset:0;
background:black;
align-items:center;
justify-content:center;
flex-direction:column;
}

#final img{
max-width:80%;
border-radius:25px;
box-shadow:0 0 50px hotpink;
animation:zoom 3s forwards;
}

@keyframes zoom{
from{transform:scale(.5);opacity:0}
to{transform:scale(1);opacity:1}
}

.heart{
position:fixed;
bottom:-20px;
color:#ff4d6d;
animation:rise linear forwards;
}

@keyframes rise{
to{
transform:translateY(-110vh);
opacity:0;
}
}
</style>
</head>

<body>

<header>For Anjali ❤️</header>

<div class="hero" id="hero">
<h1>Tap to open your gift 🎁</h1>
<button onclick="start()">Open</button>
</div>

<div id="final">
<img src="her.jpg">
<h1>I love you ❤️</h1>
</div>

<audio id="song">
<source src="song.mp3">
</audio>

<script>
function start(){
document.getElementById("hero").style.display="none";
document.getElementById("final").style.display="flex";
document.getElementById("song").play();

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(Math.random()*25+20)+"px";
h.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},200);
}
</script>

</body>
</html>
